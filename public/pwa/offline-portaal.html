<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline | Frederiks Kledingportaal</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f5f4;color:#1c1c1c;display:flex;align-items:center;justify-content:center;padding:24px}
  main{max-width:380px;width:100%;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:22px;margin:20px 0 8px;letter-spacing:-.01em}
  p{margin:0 0 8px;line-height:1.5;color:#52504e;font-size:15px}
  button{margin-top:20px;min-height:44px;padding:10px 22px;border:0;border-radius:8px;background:#ec6726;color:#1c1c1c;font-weight:600;font-size:15px;cursor:pointer}
  button:focus-visible{outline:3px solid #1c1c1c;outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/pwa/portaal-192.png" alt="" width="72" height="72">
  <h1>Je bent offline</h1>
  <p>Het kledingportaal heeft internet nodig om je kledinglijn en bestellingen te laden.</p>
  <p>Zodra je weer verbinding hebt, kun je verder waar je was.</p>
  <button type="button" onclick="location.reload()">Opnieuw proberen</button>
</main>
</body>
</html>
